# Validity checks for `snakemake simulations` (simulate_eeg.py). Each tag keeps a
# real session's montage and events and replaces only the signal. Frontal
# electrodes carry the planted effect; every other electrode should show none.

# hg_power: pink noise + 70-150 Hz noise on every channel; on target_lobes the
# 70-150 Hz part is scaled by hg_gain from onset on.
hg_null:
  data_generating_process: hg_power
  band: [70, 150]
  hg_amplitude: 10
  hg_gain: 1
  target_lobes: [frontal]
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
hg_latency:            # latency order: high-gamma gain steps up at a known time per lobe (half-max = onset)
  data_generating_process: hg_power
  band: [70, 150]
  hg_amplitude: 10
  hg_gain: 4
  target_lobes: [frontal, occipital, parietal, limbic, hippocampus, temporal]
  onset_ms: {frontal: 50, occipital: 100, parietal: 150, limbic: 200, hippocampus: 250, temporal: 300}
  pinknoise_amplitude: 10
  pinknoise_exponent: 1
# Volume conduction: ciPLV and AEC-c should not respond.
leak_frontal:          # zero-lag common source on frontal channels after onset
  data_generating_process: leak
  target_lobes: [frontal]
  leak_gain: 1
  pinknoise_amplitude: 10
  pinknoise_exponent: 1

sync_equal:            # null 2 (Riley): alpha phase coupling + shared high-gamma envelope in every lobe,
  data_generating_process: [osc_lag, hg_envelope]   # equal before and after onset -> no change anywhere
  target_lobes: [frontal, temporal, parietal, occipital, limbic, hippocampus]
  global_ppc: 0.01
  target_ppc0: 0.9999   # near-deterministic phases: alpha power and ciPLV differences ~0 with
  target_ppc1: 0.9999   # almost no scatter (AEC-c needs envelope fluctuations, so it keeps some)
  phase_lag: 1.5708
  oscillation_frequency: 10
  osc_amplitude: 20
  band: [70, 110]
  env_hz: 4
  env_depth: 0.5
  hg_amplitude: 10
  equal_conditions: true
  pinknoise_amplitude: 1
  pinknoise_exponent: 1

ceiling:               # every effect at once, strong, near-noise-free, frontal only, 200-600 ms:
  # ciPLV/AEC-c/power/decoder AUC/reliability at their maximum in frontal, 0 elsewhere; epoch
  # network and decoder only in the 200-600 ms epochs (timing)
  data_generating_process: [osc_lag, hg_envelope, hg_power]
  target_lobes: [frontal]
  active_ms: [200, 600]
  global_ppc: 0.01
  target_ppc0: 0.01
  target_ppc1: 0.99
  phase_lag: 1.5708
  oscillation_frequency: 10
  osc_amplitude: 20
  band: [70, 110]
  env_hz: 4
  env_depth: 1          # e^2 ~ 7x high-gamma power: depth 2 (e^8 ~ 3000x) buried the hg_gain
  hg_amplitude: 10
  hg_gain: 10
  recalled_only: true    # high-gamma gain on later-recalled words only (decoder AUC -> 1)
  pinknoise_amplitude: 1
  pinknoise_exponent: 1

# Recovery sweeps (-> <figures>/simulations/recovery.png): each value becomes its
# own tag `<sweep>_<value>` with every key in `keys` set to that value.
sweeps:
  rec_power:           # amplitude gain after onset -> planted 20*log10(gain) dB
    keys: [hg_gain]
    values: [1, 1.5, 2, 4]
    params:
      data_generating_process: hg_power
      band: [70, 150]
      hg_amplitude: 10
      target_lobes: [frontal]
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
  rec_ciplv:           # post-onset phase consistency among frontal pairs (half lagged pi/2)
    keys: [target_ppc1]
    values: [0.01, 0.25, 0.5, 0.75]
    params:
      data_generating_process: osc_lag
      target_lobes: [frontal]
      global_ppc: 0.01
      target_ppc0: 0.01
      phase_lag: 1.5708
      oscillation_frequency: 10
      osc_amplitude: 20
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
  rec_aec_c:           # depth of the shared post-onset envelope among frontal channels
    keys: [env_depth]
    values: [0, 0.5, 1, 2]
    params:
      data_generating_process: hg_envelope
      target_lobes: [frontal]
      band: [70, 110]
      env_hz: 4
      hg_amplitude: 10
      pinknoise_amplitude: 10
      pinknoise_exponent: 1
